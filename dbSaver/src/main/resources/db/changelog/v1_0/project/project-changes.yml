databaseChangeLog:
  - changeSet:
      id: project-1
      author: gromov-nikita
      changes:
        - createTable:
            tableName: project
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(200)
                  constraints:
                    nullable: true
              - column:
                  name: domain
                  type: varchar(15)
                  constraints:
                    nullable: false
