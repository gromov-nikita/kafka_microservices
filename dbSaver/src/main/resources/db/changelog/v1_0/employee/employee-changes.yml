databaseChangeLog:
  - changeSet:
      id: employee-1
      author: gromov-nikita
      changes:
        - createTable:
            tableName: employee
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: mail
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: start_work_date
                  type: date
                  constraints:
                    nullable: false


