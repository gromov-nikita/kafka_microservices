syntax = "proto3";

option java_package = "com.gromov.notification_grpc";
option java_multiple_files = true;

service NotificationService {
  // Клиент вызывает этот метод, чтобы отправить уведомление серверу
  rpc NotifyEvent(EventRequest) returns (EventResponse);
}

message EventRequest {
  string eventId = 1;
  string message = 2;
  int64 timestamp = 3;
}

message EventResponse {
  bool success = 1;
  string details = 2;
}
